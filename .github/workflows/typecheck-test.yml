name: Run Type-check & Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  typecheck-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      # Resolution depends on how each package manager lays out node_modules, so
      # the fixtures are real installs from committed lockfiles. Tests that need
      # them skip when absent, which would hide a resolution regression.
      - name: Enable pnpm and yarn
        run: corepack enable

      - name: Install resolution fixtures
        run: npm run install-fixtures

      - name: Compile
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Run client tests & typecheck
        run: |
          cd client
          npm test
          npm run typecheck

      - name: Run server tests & typecheck
        run: |
          cd server
          npm test
          npm run typecheck

      # Launches a real VS Code, which needs a display on Linux.
      - name: Run integration tests
        run: xvfb-run -a npm test

      # The bundled language server is not bundled by esbuild and requires its
      # dependencies by name at runtime, so a packaging rule that drops one
      # produces a VSIX whose server cannot start — with no error anywhere. This
      # packages the extension and launches the server out of the archive.
      - name: Verify the packaged server starts
        run: node scripts/verify-vsix.mjs
